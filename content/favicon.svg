<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- mureev.com — the terminal, at sixteen pixels.
       Hand-rolled SVG, like everything else here.
       The cursor blinks in browsers that animate favicons (Firefox);
       everywhere else it's simply lit. Both are correct. -->
  <rect width="64" height="64" rx="9" fill="#0a0e0b"/>
  <rect width="63" height="63" x=".5" y=".5" rx="8.5" fill="none" stroke="#34ff6d" stroke-opacity=".18"/>
  <path d="M13 19 L28 32 L13 45" stroke="#34ff6d" stroke-width="7" fill="none" stroke-linecap="square"/>
  <rect x="36" y="22" width="15" height="21" fill="#e0ffe9">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.5;.5;.95;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>

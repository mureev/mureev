name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# Every action is pinned to a full commit SHA (its release tag in the comment), so a
# moved tag can't change what runs here; Dependabot proposes the updates weekly.
jobs:
  suite:
    name: unit + e2e
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test

  image:
    name: image smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # Build from owner-only files (0600), the way a sync tool once left
      # them: the Dockerfile's mode-normalizing layer has to earn its keep.
      - run: chmod -R go-rwx conf content
      - run: docker build -t site .
      - run: docker run -d --name site -p 8080:80 site
      - name: Serve like production
        run: |
          set -eu
          B=http://127.0.0.1:8080
          for _ in $(seq 30); do curl -fsS -o /dev/null "$B/" && break; sleep 1; done
          curl -fsS "$B/" | grep -q '@core-start'
          curl -fsS "$B/llms.txt" | grep -q '^# Constantine Mureev'
          curl -fsS -o /dev/null "$B/assets/og.png"
          test "$(curl -sS -o 404.html -w '%{http_code}' "$B/no-such-page")" = 404
          grep -q 'csh: 404:' 404.html
          curl -fsS -o /dev/null -D - "$B/" | grep -qi '^x-clacks-overhead: GNU Terry Pratchett'
          curl -sS -o /dev/null -D - "$B/no-such-page" | grep -qi '^x-clacks-overhead: GNU Terry Pratchett'
          curl -fsS -o /dev/null -D - -H 'Accept-Encoding: gzip' "$B/" | grep -qi '^content-encoding: gzip'
          docker exec site wget -q --spider http://127.0.0.1/
      # The e2e suite once more, aimed at the container: the real nginx, its
      # headers, types and caching, under the pages' own CSP.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: e2e against the container
        run: npm run test:e2e
        env:
          E2E_URL: http://127.0.0.1:8080/
      - if: failure()
        run: docker logs site

  # Delivery (2026-10-01): when both checks pass on master, publish the image to GHCR. veesp's docker-autoupdate
  # ("continuous") sees the new :master digest within ~2 minutes, deploys it behind a health check through nginx and
  # rolls back on failure. The image carries no CVs: they live only on the server, mounted read-only at /assets/CV.
  release:
    name: publish image
    needs: [suite, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: no PDFs in the public image
        run: |
          pdfs=$(git ls-files -- ':(icase)*.pdf')
          if [ -n "$pdfs" ]; then
            echo "::error::PDFs are tracked; CVs must stay out of the repo and the public image"
            printf '%s\n' "$pdfs"; exit 1
          fi
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/mureev/mureev.com
          tags: |
            type=raw,value=master
            type=sha,format=short,prefix=sha-
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

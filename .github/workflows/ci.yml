name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# One run per branch at a time: a newer push waits for the running one
# instead of racing it (and replaces a run still waiting), so :master only
# moves forward.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

# Every action is pinned to a full commit SHA (its release tag in the
# comment), so a moved tag can't change what runs here; Dependabot proposes
# the updates weekly. The runners are pinned too: a new Ubuntu should arrive
# as a commit, not a surprise.
jobs:
  suite:
    name: unit + e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # nothing here pushes; npm code needn't find a token
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/chromium
      - run: npm test

  # Build once, test that image, ship that image: the build is set aside
  # before any npm code runs, and publish — a job that runs none — ships it.
  # This job can't push anything.
  image:
    name: image — build and test
    needs: suite
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      sha256: ${{ steps.build.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # nothing here pushes; npm code needn't find a token
      - name: no PDFs in the image
        run: |
          pdfs=$(git ls-files -- ':(icase)*.pdf')
          if [ -n "$pdfs" ]; then
            echo "::error::PDFs are tracked; CVs must stay out of the repo and the public image"
            printf '%s\n' "$pdfs"; exit 1
          fi
      # Build from owner-only files (0600), the way a sync tool once left
      # them: the Dockerfile's chmod has to make the shipped image readable.
      - run: chmod -R go-rwx conf content
      - id: build
        run: |
          docker build --platform linux/amd64 --label "org.opencontainers.image.revision=$GITHUB_SHA" -t site .
          docker save site -o site.tar
          echo "sha256=$(sha256sum site.tar | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image
          path: site.tar
          retention-days: 3           # long enough to re-run a failed publish
          if-no-files-found: error
      - run: docker run -d --name site -p 8080:80 site
      # Up, and serving this site, before anything is installed to test it;
      # the e2e run below checks every header, type and status. A shell
      # asking for / gets the session as text, so the page is asked for by name.
      - name: smoke test
        run: |
          set -eu
          B=http://127.0.0.1:8080
          for _ in $(seq 30); do curl -fsS -o /dev/null "$B/" && break; sleep 1; done
          curl -fsS "$B/index.html" | grep -q '@core-start'      # the page, not nginx's welcome
          curl -fsS "$B/" | grep -q "G'day"                       # the text a shell gets
          docker exec site wget -q --spider http://127.0.0.1/     # what the HEALTHCHECK runs
      # The e2e suite once more, aimed at the container: the real nginx, its
      # headers, types and caching, under the pages' own CSP.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/chromium
      - name: e2e against the container
        run: npm run test:e2e
        env:
          E2E_URL: http://127.0.0.1:8080/
      - if: failure()
        run: docker logs site

  # On master only: the one job holding a token that can deploy, and it runs
  # no third-party code but the artifact download. The server picks up a new
  # :master within minutes.
  publish:
    name: publish to GHCR
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image
      - name: push the tested image
        env:
          ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TESTED: ${{ needs.image.outputs.sha256 }}
        run: |
          set -euo pipefail
          echo "$TESTED  site.tar" | sha256sum -c - || { echo "::error::not the image that was built and tested"; exit 1; }
          docker load -i site.tar
          IMAGE=ghcr.io/mureev/mureev.com
          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker tag site "$IMAGE:sha-${GITHUB_SHA::7}"
          docker push "$IMAGE:sha-${GITHUB_SHA::7}"
          # :master follows master's head only: a re-run of an older commit
          # must not roll it back. If the head can't be read, fail — better a
          # red run than a silent non-deploy.
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/master" --jq .sha)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::notice::master is at ${head::7} now and ships itself; this run published sha-${GITHUB_SHA::7} only"
            exit 0
          fi
          docker tag site "$IMAGE:master"
          docker push "$IMAGE:master"

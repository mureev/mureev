name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# One run per branch at a time, in push order: a newer push waits for the
# running one instead of racing it, so :master only ever moves forward.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

# Every action is pinned to a full commit SHA (its release tag in the comment), so a
# moved tag can't change what runs here; Dependabot proposes the updates weekly.
jobs:
  suite:
    name: unit + e2e
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test

  # Build once, test that image, ship that image. Delivery (2026-10-01): on master, the image that just
  # passed goes to GHCR; veesp's docker-autoupdate ("continuous") sees the new :master digest within
  # ~2 minutes, deploys it behind a health check through nginx and rolls back on failure. The image
  # carries no CVs: they live only on the server, mounted read-only at /assets/CV.
  image:
    name: image — build, test, ship
    needs: suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: no PDFs in the image
        run: |
          pdfs=$(git ls-files -- ':(icase)*.pdf')
          if [ -n "$pdfs" ]; then
            echo "::error::PDFs are tracked; CVs must stay out of the repo and the public image"
            printf '%s\n' "$pdfs"; exit 1
          fi
      # Build from owner-only files (0600), the way a sync tool once left
      # them: the Dockerfile's mode-normalizing layer has to earn its keep —
      # in the very image that ships.
      - run: chmod -R go-rwx conf content
      - run: docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" -t site .
      - run: docker run -d --name site -p 8080:80 site
      - name: Serve like production
        run: |
          set -eu
          B=http://127.0.0.1:8080
          for _ in $(seq 30); do curl -fsS -o /dev/null "$B/" && break; sleep 1; done
          curl -fsS "$B/" | grep -q '@core-start'
          curl -fsS "$B/llms.txt" | grep -q '^# Constantine Mureev'
          curl -fsS -o /dev/null "$B/assets/og.png"
          test "$(curl -sS -o 404.html -w '%{http_code}' "$B/no-such-page")" = 404
          grep -q 'csh: 404:' 404.html
          curl -fsS -o /dev/null -D - "$B/" | grep -qi '^x-clacks-overhead: GNU Terry Pratchett'
          curl -sS -o /dev/null -D - "$B/no-such-page" | grep -qi '^x-clacks-overhead: GNU Terry Pratchett'
          curl -fsS -o /dev/null -D - -H 'Accept-Encoding: gzip' "$B/" | grep -qi '^content-encoding: gzip'
          docker exec site wget -q --spider http://127.0.0.1/
      # The e2e suite once more, aimed at the container: the real nginx, its
      # headers, types and caching, under the pages' own CSP.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: e2e against the container
        run: npm run test:e2e
        env:
          E2E_URL: http://127.0.0.1:8080/
      - name: publish to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          IMAGE=ghcr.io/mureev/mureev.com
          echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker tag site "$IMAGE:sha-${GITHUB_SHA::7}"
          docker push "$IMAGE:sha-${GITHUB_SHA::7}"
          # :master follows master's head only — a re-run of an older commit must not roll it back
          head=$(git ls-remote origin refs/heads/master | cut -f1)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::notice::master is at ${head::7} now and ships itself; this run published sha-${GITHUB_SHA::7} only"
            exit 0
          fi
          docker tag site "$IMAGE:master"
          docker push "$IMAGE:master"
      - if: failure()
        run: docker logs site

name: production

# Once a day, the live site: the e2e suite aimed at https://mureev.com/, with
# the checks only production can fail — the TLS proxy, the certificates, the
# CVs the server mounts, and a month's warning before security.txt expires.
# A red run emails whoever last edited this schedule.
on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    name: mureev.com, live
    runs-on: ubuntu-24.04   # pinned, like ci.yml
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/chromium
      - name: e2e against the live site
        run: npm run test:e2e
        env:
          E2E_URL: https://mureev.com/

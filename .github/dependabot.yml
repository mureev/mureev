# Weekly, one PR per ecosystem: the SHA-pinned actions, the nginx base image
# (pinned to a minor, so these are the deliberate bumps) and Playwright. CI
# tests whatever is merged.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev:
        patterns: ["*"]

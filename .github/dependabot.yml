# One grouped PR a week per ecosystem: the SHA-pinned actions in
# .github/workflows/, the nginx base image (the Dockerfile pins its minor
# version, so these are the deliberate bumps; odd minors are nginx's
# mainline — the branch nginx itself recommends — even ones its stable:
# either serves a static site, and CI tests whichever is merged), and
# Playwright.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev:
        patterns: ["*"]

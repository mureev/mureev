# Cache policy, by type: images keep for a day; everything else revalidates
# on every visit, so a deploy shows on the next one (a 304 costs a round
# trip, not a download). A 304 carries no type, and no cache headers
# either: the browser keeps the ones it has — send "no-cache" there and an
# image would lose its day at the first revalidation.
map $sent_http_content_type $expires {
    ""          off;
    ~^image/    1d;
    default     epoch;
}
# Only pages say they can't be framed — not PDFs, whose viewers may frame
# them internally. Used in security-headers.inc.
map $sent_http_content_type $frame_ancestors {
    ~^text/html "frame-ancestors 'none'";
    default     "";
}

server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    server_tokens     off;      # error pages and headers name no version
    absolute_redirect off;      # TLS ends at the proxy: a redirect stays relative, on https
    charset           utf-8;    # text/plain (llms.txt, robots.txt) has to say so
    expires           $expires;

    # Response headers live in security-headers.inc beside this file
    # (include paths start at /etc/nginx, hence conf.d/).
    # nginx lesson worth keeping: add_header does NOT inherit into scopes that
    # declare their own add_header, and the legacy CORS `if` blocks below do.
    # Hence the snippet rides once here — covering 404/50x, HEAD and anything
    # outside the ifs — and once inside the GET block. Both are deliberate;
    # removing either loses the headers somewhere.
    include conf.d/security-headers.inc;

    # The site brags about its gzipped size; origin should deliver it.
    gzip            on;
    gzip_vary       on;
    gzip_types      text/plain text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    location / {
        # Legacy wide-open CORS (after enable-cors.org), kept on purpose.
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
            add_header 'Access-Control-Max-Age' 1728000;     # 20 days
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }
        if ($request_method = 'POST') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;
            add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;
        }
        if ($request_method = 'GET') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;
            add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;
            include conf.d/security-headers.inc;   # see note at server level
        }

        root   /usr/share/nginx/html;
    }

    # missing pages get the terminal treatment too — and so do directories,
    # which have no index to show (nginx would say 403)
    error_page   403 404  =404 /404.html;
    location = /404.html {
        root   /usr/share/nginx/html;
    }

    # and server errors get the terminal's 50x
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}

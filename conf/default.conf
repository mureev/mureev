server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    # GNU Terry Pratchett — https://xclacksoverhead.org
    # (nginx lesson worth keeping: add_header does NOT inherit into scopes
    #  that declare their own add_header, and the legacy CORS `if` blocks
    #  below do. Hence this header rides once here — covering 404/50x and
    #  anything outside the ifs — and once inside the GET block. Both are
    #  deliberate; removing either loses the header somewhere.)
    add_header 'X-Clacks-Overhead' 'GNU Terry Pratchett' always;

    # The site brags about its gzipped size; origin should deliver it.
    # (Cloudflare compresses at its own edge regardless — this covers
    #  direct hits and keeps the brag honest.)
    gzip            on;
    gzip_types      text/plain text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    location / {
        # Based on https://enable-cors.org/s
        #
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            #
            # Custom headers and headers various browsers *should* be OK with but aren't
            #
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
            #
            # Tell client that this pre-flight info is valid for 20 days
            #
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }
        if ($request_method = 'POST') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;
            add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;
        }
        if ($request_method = 'GET') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;
            add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;
            add_header 'X-Clacks-Overhead' 'GNU Terry Pratchett' always;   # see note at server level
        }

        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    # missing pages get the terminal treatment too
    #
    error_page   404  /404.html;
    location = /404.html {
        root   /usr/share/nginx/html;
    }

    # redirect server error pages to the static page /50x.html
    #
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
